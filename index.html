// ============ AUDIO ============
let AC=null, master=null, noiseBuf=null, muted=false;
function audioInit(){
  if(!AC){ try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.45; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){AC=null} }
  if(AC && AC.state==='suspended') AC.resume().catch(()=>{});
}
const aOK=()=>AC && AC.state==='running' && !muted;
function env(g,t,a,peak,rel){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+rel); }
function osc(type,f,t,dur,peak,dest){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); env(g,t,0.005,peak,dur); o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+0.05); return o; }
function noise(t,dur,peak,ftype,freq,q){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=freq; if(q) f.Q.value=q; const g=AC.createGain(); env(g,t,0.002,peak,dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.05); }
function sKick(t){ if(!aOK())return; const o=osc('sine',160,t,0.18,0.9); o.frequency.exponentialRampToValueAtTime(38,t+0.14); }
function sSnare(t){ if(!aOK())return; noise(t,0.13,0.5,'bandpass',1900,0.8); osc('triangle',190,t,0.08,0.3); }
function sHat(t){ if(!aOK())return; noise(t,0.035,0.18,'highpass',7500); }
function sClick(t,hi){ if(!aOK())return; osc('square',hi?1500:1000,t,0.03,0.15); }
function sBlip(){ if(!aOK())return; osc('square',880,AC.currentTime,0.04,0.08); }
function sBump(){ if(!aOK())return; osc('square',90,AC.currentTime,0.06,0.15); }
function sBlock(){ if(!aOK())return; const t=AC.currentTime; osc('triangle',1320,t,0.12,0.25); osc('square',2640,t,0.05,0.06); noise(t,0.05,0.2,'highpass',5000); }
function sHurt(){ if(!aOK())return; const t=AC.currentTime; noise(t,0.25,0.6,'lowpass',700); const o=osc('sawtooth',220,t,0.25,0.25); o.frequency.exponentialRampToValueAtTime(50,t+0.25); }
function sMiss(){ if(!aOK())return; osc('square',110,AC.currentTime,0.08,0.12); }
const RIFF=[0,0,3,5,0,7,5,3,0,10,7,5];
function sInstr(sp,i){
  if(!aOK())return; const t=AC.currentTime, semi=RIFF[i%RIFF.length], fr=b=>b*Math.pow(2,semi/12);
  if(sp==='guitare'||sp==='basse'){
    const base=sp==='basse'?41.2:82.4, ws=AC.createWaveShaper(), cur=new Float32Array(256);
    for(let k=0;k<256;k++){const x=k/128-1; cur[k]=Math.tanh(x*(sp==='basse'?3:9));} ws.curve=cur;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=sp==='basse'?700:2600;
    const g=AC.createGain(); env(g,t,0.004,0.35,0.28); ws.connect(lp); lp.connect(g); g.connect(master);
    [1,1.5,2].forEach(m=>{const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fr(base)*m; o.connect(ws); o.start(t); o.stop(t+0.4);});
  } else if(sp==='batterie'){ (i%2? sSnare:sKick)(t); noise(t,0.08,0.15,'highpass',6000); }
  else if(sp==='chant'){
    const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fr(220);
    const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=6; lg.gain.value=9; l.connect(lg); lg.connect(o.frequency);
    const f1=AC.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=800; f1.Q.value=4;
    const g=AC.createGain(); env(g,t,0.02,0.6,0.3); o.connect(f1); f1.connect(g); g.connect(master);
    noise(t,0.12,0.08,'bandpass',2500,2);
    o.start(t); l.start(t); o.stop(t+0.4); l.stop(t+0.4);
  } else if(sp==='synthe'){
    [0,0.04,0.08].forEach((d,k)=>osc('square',fr(330)*[1,1.26,1.5][k],t+d,0.1,0.12));
  }
}
function jingle(notes,step){ if(!aOK())return; const t=AC.currentTime; notes.forEach((n,i)=>{ if(n) osc('square',440*Math.pow(2,(n-9)/12),t+i*step,step*0.9,0.12); }); }

  suraigu:{name:'CRI SURAIGU',type:'VOIX',pow:56,bpm:120,pat:[0,1,1.5,2,2.5,3.5]},
  scream:{name:'SCREAM GUTTURAL',type:'VOIX',pow:76,bpm:135,pat:[0,0.5,1,1.75,2,2.5,3,3.25,3.5]},
  slap:{name:'SLAP',type:'CORDES',pow:38,bpm:105,pat:[0,0.5,1.5,2,3]},
  groove:{name:'GROOVE LOURD',type:'CORDES',pow:44,bpm:90,pat:[0,1,1.5,2.5,3]},
  arpege:{name:'ARPÈGE',type:'ÉLECTRO',pow:38,bpm:120,pat:[0,0.5,1,1.5,2]},
  nappe:{name:'NAPPE SOMBRE',type:'ÉLECTRO',pow:46,bpm:95,pat:[0,1,2,2.5,3,3.5]},
  glitch:{name:'GLITCH',type:'ÉLECTRO',pow:62,bpm:130,pat:[0,0.25,1,1.25,2,2.75,3]},
};
function mk(sp,lvl){ const m={sp,lvl,xp:0,hp:0}; m.hp=st(m).maxHp; return m; }
function st(m){ const s=SP[m.sp]; return {maxHp:s.hp+m.lvl*3, atk:s.atk+m.lvl, def:s.def+m.lvl}; }
function movesOf(m){ return SP[m.sp].moves.filter(x=>x[0]<=m.lvl).map(x=>x[1]).slice(-4); }
function tMult(a,d){ return TYPES[a]===d?1.5:(TYPES[d]===a?0.67:1); }
function calcDmg(att,def,mv,acc){ const r=st(att).atk/st(def).def; return Math.round(mv.pow*r*tMult(mv.type,SP[def.sp].type)*acc*0.6*(0.9+Math.random()*0.1)); }

const MW=MAP[0].length, MH=MAP.length;
const tile=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?'T':MAP[y][x];
const SOLID='TWRHDSFA';
const SIGNS={
  '2,5':'MAISON DE TOI. Pas de bruit, les voisins dorment.',

// ============ ÉTAT ============
let G=null; // état sauvegardable
function newState(){ return {party:[],items:{kit:0,case:0},flags:{},x:4,y:5,dir:'down',badge:false}; }
const P={ox:0,oy:0,moving:false,step:0,turnT:0,mvT:0,dx:0,dy:0};
let NPCS=[];
function buildNpcs(){
  NPCS=[
    {id:'papy',x:10,y:7,dir:'down',look:'beard',name:'PAPY LARSEN'},
    {id:'jerome',x:4,y:17,dir:'right',look:'longhair',name:'BASSISTE JÉRÔME',sight:5,
      team:[['basse',6]],pre:'Toi ! Tu marches pas en rythme. Ça m\'agace.',lose:'Ok... t\'as du groove. Tiens, prends ça.',gift:{case:2},after:'Le groove, ça se travaille. Tous les jours.'},
    {id:'dede',x:15,y:22,dir:'left',look:'mohawk',name:'PUNK DÉDÉ',sight:7,

    {id:'sonia',x:11,y:29,dir:'left',look:'bun',name:'CLAVIÉRISTE SONIA',sight:3,
      team:[['synthe',8],['guitare',8]],pre:'Ton son manque de profondeur. Je vais t\'en donner.',lose:'Intéressant... Il te manque juste un peu de reverb.',gift:{case:2,kit:2},after:'Le GOUFFRE est juste en bas. Bonne chance.'},
    {id:'boss',x:4,y:36,dir:'right',look:'corpse',name:'LA VOIX DU GOUFFRE',sight:4,boss:true,
      team:[['chant',10],['synthe',10],['batterie',11]],pre:'Tu oses frapper à la porte du GOUFFRE ? Montre-moi ce que tu vaux.',lose:'... Le GOUFFRE te reconnaît. Prends ce BADGE LARSEN.',after:'Le prochain concert sera le tien.'},

  NPCS.forEach(n=>{n.ox=0;n.oy=0;n.bang=false;});

const npcAt=(x,y)=>NPCS.find(n=>n.x===x&&n.y===y);
function save(){ try{ localStorage.setItem('riffquest_v1',JSON.stringify(G)); return true;}catch(e){return false;} }
function loadSave(){ try{ const s=localStorage.getItem('riffquest_v1'); return s?JSON.parse(s):null; }catch(e){return null;} }

// ============ ENTRÉES ============
const held={}, pressed=new Set(); let onHit=null;
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Space:'a',Enter:'a',KeyJ:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyK:'b'};
function press(k){ audioInit(); if(k==='a'&&onHit){ onHit(); return; } if(!held[k]) pressed.add(k); held[k]=true; }
function release(k){ held[k]=false; }
addEventListener('keydown',e=>{ const k=KM[e.code]; if(!k)return; e.preventDefault(); if(e.repeat)return; press(k); });
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) release(k); });
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault(); b.classList.add('on'); try{b.setPointerCapture(e.pointerId);}catch(_){} press(k);});
  const up=e=>{b.classList.remove('on'); release(k);};
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
});
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press('a'); setTimeout(()=>release('a'),60); });
const pr=k=>{ if(pressed.has(k)){pressed.delete(k);return true;} return false; };
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function heldDir(){ for(const d of ['up','down','left','right']) if(held[d]) return d; return null; }

// ============ OUTILS DESSIN ============
function R(x,y,w,h,c){ ctx.fillStyle=C[c]; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function T(s,x,y,c=0,align='left'){ ctx.fillStyle=C[c]; ctx.font=FONT; ctx.textBaseline='top'; ctx.textAlign=align; ctx.fillText(s,Math.round(x),Math.round(y)); }
function box(x,y,w,h){ R(x,y,w,h,3); R(x+1,y+1,w-2,1,0); R(x+1,y+h-2,w-2,1,0); R(x+1,y+1,1,h-2,0); R(x+w-2,y+1,1,h-2,0); R(x+3,y+3,w-6,1,1); R(x+3,y+h-4,w-6,1,1); R(x+3,y+3,1,h-6,1); R(x+w-4,y+3,1,h-6,1); }
function disc(cx,cy,r,c){ for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y)); R(cx-w,cy+y,w*2+1,1,c);} }
function ellipse(cx,cy,rx,ry,c){ for(let y=-ry;y<=ry;y++){ const w=Math.floor(rx*Math.sqrt(1-(y*y)/(ry*ry))); R(cx-w,cy+y,w*2+1,1,c);} }
function wrap(s,n=17){ const words=s.split(' '), lines=[]; let cur=''; for(const w of words){ if((cur+(cur?' ':'')+w).length>n){ if(cur) lines.push(cur); cur=w; } else cur+=(cur?' ':'')+w; } if(cur) lines.push(cur); return lines; }
function hpBar(x,y,w,hp,max){ T('HP',x-14,y-2,0); R(x,y,w,4,0); R(x+1,y+1,w-2,2,3); const f=Math.max(0,Math.round((w-2)*hp/max)); R(x+1,y+1,f,2,hp/max<0.25?0:1); }

// Personnage 16x16 (unité = s px)
function drawPerson(x,y,dir,stp,look,s=1,back=false){
  const r=(a,b,w,h,c)=>R(x+a*s,y+b*s,w*s,h*s,c);
  const side=dir==='left'||dir==='right', flip=dir==='left';
  const rx=(a,b,w,h,c)=>flip? r(16-a-w,b,w,h,c) : r(a,b,w,h,c);
  // jambes
  const l1=stp===1?-1:0, l2=stp===2?-1:0;
  r(5,13+l1,2,3+(-l1),1); r(9,13+l2,2,3+(-l2),1); r(5,15,2,1,0); r(9,15,2,1,0);
  // corps (t-shirt noir)
  r(4,9,8,5,(dir==='up'||back)?1:0); r(3,9,1,4,3); r(12,9,1,4,3); r(3,13,1,1,0); r(12,13,1,1,0);
  if(look!=='corpse'&&dir==='down') r(6,10,4,2,1); // logo du t-shirt
  // tête
  r(4,1,8,8,0); r(5,2,6,6,3);
  const up=dir==='up'||back;
  if(look==='longhair'||look==='corpse'){ r(4,0,8,3,0); if(up){ r(4,1,8,8,0); r(5,9,6,2,0); r(6,11,4,1,0);} else if(side){ rx(4,1,4,11,0); } else { r(3,2,2,10,0); r(11,2,2,10,0);} }
  if(look==='mohawk'){ r(7,-3,2,4,0); if(up) r(5,2,6,3,1); }
  if(look==='cap'){ r(4,0,8,3,1); if(dir==='down') r(4,3,8,1,0); else if(side) rx(11,2,4,1,0); if(up) r(5,3,6,4,1); }
  if(look==='bun'){ r(6,-2,4,3,0); r(4,0,8,3,0); if(up) r(5,1,6,5,0); else if(side) rx(4,1,3,6,0); }
  if(look==='beard'){ if(up) r(5,2,6,4,2); else if(!side) r(5,6,6,4,2); else rx(8,6,4,4,2); }
  if(!up){
    if(dir==='down'){ r(6,4,1,2,0); r(9,4,1,2,0); if(look==='corpse'){ r(5,3,3,3,0); r(8,3,3,3,0); r(7,7,2,1,0);} }
    else { rx(10,4,1,2,0); if(look==='corpse') rx(9,3,3,3,0); }
  }
}

function hash(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>13))*1274126177; return (h^(h>>16))>>>0; }

  if(t==='T'){ r(6,11,4,5,0); r(7,11,2,4,1); for(let yy=-6;yy<=5;yy++){ const w=Math.round(Math.sqrt(42-yy*yy)); r(8-w,7+yy,w*2,1,0);} for(let yy=-5;yy<=4;yy++){ const w=Math.round(Math.sqrt(28-yy*yy)); r(8-w,7+yy,w*2,1,1);} r(4,3,3,2,2); r(9,6,2,2,2); r(5,9,2,1,2); }

const tweens=[];
function tween(o,k,to,dur){ return new Promise(res=>tweens.push({o,k,from:o[k],to,dur:Math.max(dur,0.001),t:0,res})); }
const wait=s=>tween({v:0},'v',1,s);
let ui=null;
function widget(w){ return new Promise(res=>{ w.done=v=>{ if(ui===w) ui=null; res(v); }; ui=w; }); }

function say(text,opt={}){

    update(dt){ const p=pages[this.pg], total=p.join('').length; if(this.ch<total){ this.ch+=dt*55; if(pr('a')) this.ch=total; }
      else { this.t+=dt; if(pr('a')||pr('b')||(opt.auto&&this.t>opt.auto)){ sBlip(); this.pg++; this.ch=0; this.t=0; if(this.pg>=pages.length) this.done(); } } },
    draw(){ box(0,96,160,48); const p=pages[this.pg]||[]; let n=this.ch|0; p.forEach((l,i)=>{ T(l.slice(0,Math.max(0,n)),8,106+i*16); n-=l.length; });

  });
}

function walkable(x,y){ return !SOLID.includes(tile(x,y)) && !npcAt(x,y) && !(G.x===x&&G.y===y); }
function updateWorld(dt){
  worldTime+=dt;
  if(P.moving){
    P.mvT+=dt/0.2; const k=Math.min(1,P.mvT); P.ox=P.dx*16*(k-1); P.oy=P.dy*16*(k-1);
    if(k>=1){ P.moving=false; P.ox=P.oy=0; afterStep(); }
    else return;
  }
  if(busy||ui) return;
  if(pr('a')) return interact();
  if(pr('b')) return worldMenu();
  const d=heldDir();
  if(!d){ P.turnT=0; return; }
  if(d!==G.dir){ G.dir=d; P.turnT=0.07; return; }
  if(P.turnT>0){ P.turnT-=dt; return; }
  const [dx,dy]=DIRS[d], nx=G.x+dx, ny=G.y+dy;
  if(!walkable(nx,ny)){ if(!P.bumped){ sBump(); P.bumped=true; } return; }
  P.bumped=false; G.x=nx; G.y=ny; P.dx=dx; P.dy=dy; P.mvT=0; P.moving=true; P.step=(P.step%2)+1; P.ox=-dx*16; P.oy=-dy*16;
}

      const pick=await moveMenu(me,ids); if(pick<0) continue;
      const mv=MV[ids[pick]];
      await sayB(`${SP[me.sp].name} lance ${mv.name} !`);
      const res=await rhythm({mv,sp:me.sp,mode:'atk'});
      const acc=res.reduce((s,j)=>s+(j==='P'?1:j==='B'?0.6:0),0)/res.length, full=res.every(j=>j==='P');
      let dmg=calcDmg(me,foeM,mv,acc); if(full) dmg=Math.round(dmg*1.25);
      if(dmg>0){ B.side='foe'; sHurt(); B.shake=3; tween(B,'shake',0,0.4); foeM.hp=Math.max(0,foeM.hp-dmg); await tween(B,'fHp',foeM.hp,0.5); }
      if(full) await sayB('FULL COMBO ! Le public est en délire !');
      else if(acc===0) await sayB('Personne n\'a rien entendu...');
      const tm=tMult(mv.type,SP[foeM.sp].type); if(dmg>0&&tm>1) await sayB('C\'est super efficace !'); if(dmg>0&&tm<1) await sayB('Ce n\'est pas très efficace...');
      if(foeM.hp<=0){ const r=await foeFainted(); if(r) return r; continue; }
      acted=true;
    } else if(a===1){
      const k=await partyScreen('switch'); if(k<0) continue;
      if(k===0){ await sayB('Il est déjà sur scène !'); continue; }
      if(G.party[k].hp<=0){ await sayB('Cet instrument est HS !'); continue; }
      await sayB(`Reviens, ${SP[me.sp].name} !`); const m=G.party.splice(k,1)[0]; G.party.unshift(m); B.mHp=m.hp; await sayB(`À toi, ${SP[m.sp].name} !`); acted=true;
    } else if(a===2){
      const it=await choose([`KIT x${G.items.kit}`,`CASE x${G.items.case}`],{x:72,y:52,w:88});
      if(it<0) continue;
      if(it===0){ if(!G.items.kit){ await sayB('Plus de KIT DE CORDES !'); continue; } const mx=st(me).maxHp; if(me.hp>=mx){ await sayB('Déjà en pleine forme.'); continue; }
        G.items.kit--; me.hp=Math.min(mx,me.hp+25); jingle([12,19],0.1); await tween(B,'mHp',me.hp,0.5); await sayB(`${SP[me.sp].name} a de nouvelles cordes !`); acted=true; }
      else { if(!G.items.case){ await sayB('Plus de FLIGHT CASE !'); continue; }
        if(foe.trainer){ await sayB('On ne pique pas l\'instru des autres !'); continue; }
        if(G.party.length>=6){ await sayB('Ton van est plein (6 max) !'); continue; }
        G.items.case--; const caught=await tryCapture(); if(caught) return 'win'; acted=true; }
    } else if(a===3){
      if(foe.trainer){ await sayB('Impossible de fuir un duel !'); continue; }
      await sayB('Tu prends la fuite !'); mode='world'; return 'flee';
    }
    if(acted){ const r=await foeTurn(); if(r) return r; }
  }
}
function moveMenu(me,ids){
  return widget({i:0,
    update(){ const n=ids.length; if(pr('up')){this.i=(this.i+n-1)%n;sBlip();} if(pr('down')){this.i=(this.i+1)%n;sBlip();} if(pr('a')){sBlip();this.done(this.i);} if(pr('b')){sBlip();this.done(-1);} },
    draw(){ const mv=MV[ids[this.i]]; box(0,52,82,44); T('TYPE/',6,58); T(mv.type,14,68); T('♪'+mv.pat.length+' '+mv.bpm+'BPM',6,80);
      box(0,96,160,48); ids.forEach((id,k)=>{ T(MV[id].name,18,101+k*10); if(k===this.i) T('▶',8,101+k*10); }); }
  });
}
async function foeTurn(){
  const foeM=B.foeMon, me=B.me(), ids=movesOf(foeM), mv=MV[ids[(Math.random()*ids.length)|0]];
  await sayB(`${SP[foeM.sp].name} ennemi lance ${mv.name} !`);
  const res=await rhythm({mv,sp:foeM.sp,mode:'def'});
  const frac=res.reduce((s,j)=>s+(j==='P'?0:j==='B'?0.5:1),0)/res.length;
  const dmg=Math.round(calcDmg(foeM,me,mv,1)*frac);
  if(dmg>0){ B.side='me'; sHurt(); B.shake=3; tween(B,'shake',0,0.4); me.hp=Math.max(0,me.hp-dmg); await tween(B,'mHp',me.hp,0.5); }
  if(frac===0) await sayB('Tout bloqué ! Quelle maîtrise !');
  else if(tMult(mv.type,SP[me.sp].type)>1) await sayB('C\'est super efficace !');
  if(me.hp<=0){
    await tween(B,'meDrop',60,0.3); await sayB(`${SP[me.sp].name} est hors service !`);
    if(!G.party.some(m=>m.hp>0)){ B.meDrop=0; mode='world'; return 'lose'; }
    const k=await partyScreen('forced'); const m=G.party.splice(k,1)[0]; G.party.unshift(m); B.meDrop=0; B.mHp=m.hp; await sayB(`À toi, ${SP[m.sp].name} !`);
  }
  return null;
}
async function foeFainted(){
  const foeM=B.foeMon; await tween(B,'foeDrop',60,0.35);
  await sayB(`${SP[foeM.sp].name} ${B.foe.trainer?'ennemi':'sauvage'} est KO !`);
  await gainXp(foeM.lvl*(B.foe.trainer?15:10));
  if(B.foe.trainer && B.fi<B.foe.team.length-1){
    B.fi++; B.foeDrop=0; const m=B.foeMon; m.hp=st(m).maxHp; B.fHp=m.hp; await sayB(`${B.foe.name} sort : ${SP[m.sp].name} !`); return null;
  }
  if(B.foe.trainer){ B.foeDrop=0; B.foeTrainerShown=true; jingle([12,16,19,24,19,24],0.1); await sayB(`Tu as battu ${B.foe.name} !`); }
  mode='world'; return 'win';
}
async function gainXp(x){
  const m=B.me(); m.xp+=x; await sayB(`${SP[m.sp].name} gagne ${x} pts d'EXP !`);
  while(m.xp>=m.lvl*15){ m.xp-=m.lvl*15; const before=st(m).maxHp; m.lvl++; m.hp+=st(m).maxHp-before; B.mHp=m.hp; jingle([12,16,19,24],0.08); await sayB(`${SP[m.sp].name} passe au niveau ${m.lvl} !`);
    const nm=SP[m.sp].moves.find(v=>v[0]===m.lvl); if(nm) await sayB(`${SP[m.sp].name} apprend ${MV[nm[1]].name} !`); }
}
async function tryCapture(){
  const foeM=B.foeMon; await sayB('Tu lances une FLIGHT CASE !');
  B.caseShown=true; B.foeHidden=true; const s=st(foeM), chance=0.15+0.75*(1-foeM.hp/s.maxHp);
  let ok=true; for(let k=0;k<3;k++){ B.wob=0; await tween(B,'wob',1,0.45); sClick(AC?AC.currentTime:0,k===2); await wait(0.25); if(Math.random()>Math.pow(chance,1/3)){ ok=false; break; } }
  if(ok){ jingle([12,16,19,24,0,24],0.1); await sayB(`Hop ! ${SP[foeM.sp].name} rejoint ton matos !`); G.party.push({sp:foeM.sp,lvl:foeM.lvl,xp:0,hp:foeM.hp}); B.caseShown=false; mode='world'; return true; }
  B.caseShown=false; B.foeHidden=false; await sayB('Raté ! Il s\'est échappé de la case !'); return false;
}

// ============ RYTHME ============
function rhythm({mv,sp,mode:rm}){
  const useAC=aOK(), clk=useAC?()=>AC.currentTime:()=>performance.now()/1000;
  const beat=60/mv.bpm, t0=clk()+0.35, count=4, notes=mv.pat.map((b,i)=>({t:t0+(count+b)*beat,j:null,i}));
  const endT=notes[notes.length-1].t+0.6, last=Math.ceil(count+mv.pat[mv.pat.length-1])+1;
  if(useAC){ for(let k=0;k<=last;k++){ const t=t0+k*beat; if(k<count) sClick(t,k===0); else { sKick(t); if((k-count)%2===1) sSnare(t); sHat(t+beat/2); } } }
  const SPEED=95, HX=22, PF=0.055, GD=0.12;
  const w={notes,clk,pop:null,popT:0,combo:0,res:null,
    hit(){ const now=clk(); let best=null; for(const n of notes){ if(n.j) continue; const d=Math.abs(now-n.t); if(d<GD&&(!best||d<Math.abs(now-best.t))) best=n; }
      if(!best){ return; }
      best.j=Math.abs(now-best.t)<PF?'P':'B'; this.combo++; this.pop=best.j==='P'?(rm==='atk'?'PARFAIT !':'BLOQUÉ !'):(rm==='atk'?'BIEN':'PARÉ'); this.popT=0.5;
      if(rm==='atk') sInstr(sp,best.i); else sBlock(); },
    update(dt){ const now=clk(); this.popT-=dt;
      for(const n of notes){ if(!n.j&&now>n.t+GD){ n.j='M'; this.combo=0; this.pop=rm==='atk'?'RATÉ':'AÏE !'; this.popT=0.5; if(rm==='def'){ sHurt(); B.side='me'; B.shake=2; tween(B,'shake',0,0.2);} else sMiss(); } }
      if(now>endT){ onHit=null; this.done(notes.map(n=>n.j)); } },
    draw(){ const now=clk(), bp=(now-t0)/beat;
      box(0,96,160,48);
      T(rm==='atk'?'♪ EN RYTHME !':'✖ BLOQUE !',8,101,rm==='atk'?0:1);
      R(6,113,148,22,2); R(6,123,148,2,1);
      for(let k=Math.ceil(bp);k<bp+3;k++){ const x=HX+(t0+k*beat-now)*SPEED; if(x<154&&x>6) R(x,114,1,20,1); }
      const pulse=(bp>0&&(bp%1)<0.15)?1:0; R(HX-6-pulse,117-pulse,13+pulse*2,13+pulse*2,0); R(HX-5,118,11,11,3); R(HX-1,122,3,3,0);
      for(const n of notes){ if(n.j==='P'||n.j==='B') continue; const x=HX+(n.t-now)*SPEED; if(x>156||x<0) continue; const y=124;
        if(rm==='atk'){ disc(Math.round(x),y,4,n.j==='M'?2:0); if(n.j!=='M'){ R(x+3,y-9,1,9,0); R(x+3,y-9,3,1,0); disc(Math.round(x),y,2,1);} }
        else { const c=n.j==='M'?2:0; R(x-4,y-1,9,3,c); R(x-1,y-4,3,9,c); R(x-3,y-3,1,1,c); R(x+3,y-3,1,1,c); R(x-3,y+3,1,1,c); R(x+3,y+3,1,1,c); R(x,y,1,1,3);} }
      if(bp>=0&&bp<count){ const n=count-Math.floor(bp); box(58,30,44,20); T(n===1?'GO !':String(n-1),80,36,0,'center'); }
      if(this.popT>0&&this.pop){ box(38,70,84,20); T(this.pop,80,76,0,'center'); }
      if(this.combo>2){ T('x'+this.combo,150,101,0,'right'); } }
  };
  pressed.delete('a');
  const p=widget(w); onHit=()=>w.hit(); return p;
}

// ============ ÉCRANS : TITRE / INTRO / STARTER ============
let titleSel=0, hasSave=false, introPerson=null;
function drawTitle(){
  R(0,0,160,144,3);
  R(0,8,160,40,0); T('RIFF',80,14,3,'center'); T('QUEST',80,28,3,'center');
  for(let i=0;i<160;i+=4) R(i,8+((i*7)%3),2,1,1);
  T('version DISTORSION',80,52,1,'center');
  drawInstr('guitare',20,62,2,true); drawInstr('batterie',64,62,2,true); drawInstr('chant',108,62,2,true);
  const opts=hasSave?['CONTINUER','NOUVELLE PARTIE']:['NOUVELLE PARTIE'];
  opts.forEach((o,k)=>{ T(o,24,104+k*12); if(k===titleSel) T('▶',14,104+k*12); });
  if((Date.now()/500|0)%2) T('APPUIE SUR A',80,132,1,'center');
}
function updateTitle(){
  const n=hasSave?2:1;
  if(pr('up')||pr('down')){ titleSel=(titleSel+1)%n; sBlip(); }
  if(pr('a')){ sBlip(); if(hasSave&&titleSel===0){ G=loadSave(); buildNpcs(); mode='world'; } else run(startNew); }
}
function drawIntro(){ R(0,0,160,144,3); if(introPerson){ ellipse(80,84,30,5,2); drawPerson(56,32,'down',0,introPerson,3); } }
async function startNew(){
  G=newState(); buildNpcs(); mode='intro'; introPerson='beard';
  await say('Salut gamin ! Moi, c\'est PAPY LARSEN. 40 ans de tournée, 3 tympans percés.');
  await say('Ce monde est rempli d\'INSTRUMENTS. Certains sont sauvages et se cachent dans les hautes herbes.');
  await say('D\'autres musiciens te défieront en DUEL RYTHMIQUE.');
  await say('Quand tu attaques : appuie sur A quand la note touche la cible.');
  await say('Quand on t\'attaque : appuie au bon moment pour BLOQUER.');
  await say('Mais d\'abord... choisis ton premier instrument !');
  const sp=await starterPick();
  G.party.push(mk(sp,5));
  await say(`Excellent choix ! ${SP[sp].name} a l'air d'en vouloir.`);
  introPerson='cap';
  await say('KÉVIN : Hé, Papy ! Moi aussi j\'en veux un !');
  const counter={guitare:'chant',batterie:'guitare',chant:'batterie'}[sp];
  await say(`KÉVIN prend ${SP[counter].name}. Il ricane : ça bat le tien, ça.`);
  await say('KÉVIN : Allez, on teste ça tout de suite !');
  const res=await battle({name:'KÉVIN',look:'cap',trainer:true,team:[mk(counter,5)]});
  mode='intro'; introPerson='cap';
  await say(res==='win'?'KÉVIN : Quoi ?! Bon... coup de chance. On se reverra !':'KÉVIN : Ha ! Trop facile ! Va répéter, débutant !');
  introPerson='beard';
  G.party.forEach(m=>m.hp=st(m).maxHp);
  await say('PAPY LARSEN : Pas mal du tout. Tiens, prends ces 5 FLIGHT CASES et 3 KITS DE CORDES.');
  G.items.case=5; G.items.kit=3;
  await say('Lance une CASE sur un instrument sauvage affaibli pour le capturer.');
  await say('Ta quête : descendre la ROUTE 666 et prouver ta valeur au GOUFFRE !');
  await say('B ouvre ton menu. Le LOCAL DE RÉPÈT soigne et sauvegarde. Va, gamin !');
  mode='world'; save();
}
function starterPick(){
  const list=['guitare','batterie','chant'];
  return widget({i:0,stage:0,
    update(){ if(pr('left')){this.i=(this.i+2)%3;sBlip();} if(pr('right')){this.i=(this.i+1)%3;sBlip();}
      if(pr('a')){ sBlip(); const sp=list[this.i]; ui=null;
        choose(['OUI','NON'],{x:110,y:56,w:50,prompt:`Tu choisis ${SP[sp].name} ?`,under:this}).then(k=>{ if(k===0) this.done(sp); else ui=this; }); } },
    draw(){ R(0,0,160,144,3); T('CHOISIS TON INSTRU',80,6,0,'center');
      list.forEach((sp,k)=>{ const x=10+k*50, sel=k===this.i, by=sel?Math.round(Math.sin(Date.now()/150)*2):0;
        if(sel){ drawInstr(sp,x+4,24+by,2,true); } else drawCase(x+8,36,2);
        R(x+2,66,44,1,sel?0:2); });
      const sp=list[this.i]; box(0,74,160,70); T(SP[sp].name,8,82); T('TYPE/'+SP[sp].type,8,94,1);
      wrap(SP[sp].desc,17).forEach((l,k)=>T(l,8,108+k*12)); T('◀ ▶',150,82,1,'right'); }
  });
}
async function wildEncounter(){
  const pool=G.y<20?[['guitare',3],['batterie',3],['chant',3],['basse',4]]:[['basse',5],['guitare',6],['batterie',6],['chant',6],['synthe',6]];
  const [sp,l]=pool[(Math.random()*pool.length)|0], lvl=l+((Math.random()*2)|0);
  const res=await battle({trainer:false,team:[mk(sp,lvl)]});
  if(res==='lose') await whiteout();
}
async function endDemo(){
  mode='end'; introPerson='corpse';
  await say('FÉLICITATIONS ! Tu as conquis le GOUFFRE avec ton matos.');
  await say('C\'est la fin de cette démo de RIFF QUEST. Merci d\'avoir joué !');
  mode='world';
}

// ============ BOUCLE ============
function drawWorld(){
  const cx=G.x*16+P.ox-72, cy=G.y*16+P.oy-64;
  const tx0=Math.floor(cx/16), ty0=Math.floor(cy/16);
  for(let y=ty0;y<=ty0+10;y++) for(let x=tx0;x<=tx0+11;x++) drawTile(tile(x,y),x,y,x*16-cx,y*16-cy,worldTime);
  const ents=NPCS.map(n=>({y:n.y*16+n.oy,d:()=>{ const sx=n.x*16+n.ox-cx, sy=n.y*16+n.oy-cy-4; drawPerson(sx,sy,n.dir,n.stp||0,n.look); if(n.bang){ box(sx+2,sy-16,12,14); T('!',sx+5,sy-13);} }}));
  ents.push({y:G.y*16+P.oy,d:()=>drawPerson(72,60,G.dir,P.moving&&P.mvT<0.75?P.step:0,'longhair')});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
}
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  for(let i=tweens.length-1;i>=0;i--){ const w=tweens[i]; w.t+=dt; const k=Math.min(1,w.t/w.dur); w.o[w.k]=w.from+(w.to-w.from)*k; if(k>=1){ tweens.splice(i,1); w.res(); } }
  if(ui) ui.update(dt);
  else if(mode==='title') updateTitle();
  else if(mode==='world') updateWorld(dt);
  if(mode!=='world') worldTime+=dt;
  ctx.setTransform(SC,0,0,SC,0,0);
  if(mode==='title') drawTitle();
  else if(mode==='intro'||mode==='end') drawIntro();
  else if(mode==='world') drawWorld();
  else if(mode==='battle') drawBattle();
  if(ui) ui.draw();
  if(flashA){ ctx.fillStyle=C[0]; ctx.fillRect(0,0,160,144); }
  pressed.clear();
  requestAnimationFrame(frame);
}
hasSave=!!loadSave();
(document.fonts?document.fonts.load('8px "Press Start 2P"').catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
